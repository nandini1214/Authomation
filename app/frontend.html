<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget App Prototype</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7; }
        h1 { color: #2c3e50; }
        form, .section { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 8px #eee; }
        label { display: block; margin-top: 10px; }
        input, select { margin-top: 5px; padding: 6px; width: 100%; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 20px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .result { margin-top: 10px; color: #16a085; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>Budget App</h1>
    <form id="budget-form">
        <h2>Set Monthly Budget</h2>
        <label>Month (1-12): <input type="number" id="budget-month" min="1" max="12" required></label>
        <label>Year: <input type="number" id="budget-year" min="2000" max="2100" required></label>
        <label>Amount: <input type="number" id="budget-amount" min="0" step="0.01" required></label>
        <button type="submit">Set Budget</button>
        <div class="result" id="budget-result"></div>
    </form>
    <form id="expense-form">
        <h2>Add Expense</h2>
        <label>Date: <input type="date" id="expense-date" required></label>
        <label>Amount: <input type="number" id="expense-amount" min="0" step="0.01" required></label>
        <label>Category: <input type="text" id="expense-category" required></label>
        <button type="submit">Add Expense</button>
        <div class="result" id="expense-result"></div>
    </form>
    <div class="section">
        <h2>Summary</h2>
        <button onclick="fetchSummary()">Refresh Summary</button>
        <pre id="summary"></pre>
    </div>
    <div class="section">
        <h2>Prediction</h2>
        <button onclick="fetchPrediction()">Get Prediction</button>
        <div id="prediction"></div>
    </div>
    <script>
        const apiBase = "http://localhost:8000";
        document.getElementById('budget-form').onsubmit = async function(e) {
            e.preventDefault();
            const month = +document.getElementById('budget-month').value;
            const year = +document.getElementById('budget-year').value;
            const amount = +document.getElementById('budget-amount').value;
            const res = await fetch(apiBase + '/budget', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ month, year, amount })
            });
            const data = await res.json();
            document.getElementById('budget-result').textContent = data.message || JSON.stringify(data);
        };
        document.getElementById('expense-form').onsubmit = async function(e) {
            e.preventDefault();
            const date = document.getElementById('expense-date').value;
            const amount = +document.getElementById('expense-amount').value;
            const category = document.getElementById('expense-category').value;
            const res = await fetch(apiBase + '/expense', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, amount, category })
            });
            const data = await res.json();
            document.getElementById('expense-result').textContent = data.message || JSON.stringify(data);
        };
        async function fetchSummary() {
            const res = await fetch(apiBase + '/summary');
            const data = await res.json();
            document.getElementById('summary').textContent = JSON.stringify(data, null, 2);
        }
        async function fetchPrediction() {
            const res = await fetch(apiBase + '/prediction');
            const data = await res.json();
            document.getElementById('prediction').textContent = data.prediction || JSON.stringify(data);
        }
        // Auto-load summary and prediction on page load
        fetchSummary();
        fetchPrediction();
    </script>
</body>
</html>
